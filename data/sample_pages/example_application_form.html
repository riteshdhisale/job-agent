<!DOCTYPE html>
<html>
<head><title>Apply - Senior Product Manager, Platform APIs</title></head>
<body>
<h1>Apply: Senior Product Manager, Platform APIs</h1>
<form>
  <label for="fname">First Name</label>
  <input id="fname" name="fname" type="text" />

  <label for="lname">Last Name</label>
  <input id="lname" name="lname" type="text" />

  <label for="email">Email</label>
  <input id="email" name="email" type="email" />

  <label for="phone">Phone Number</label>
  <input id="phone" name="phone" type="tel" />

  <label for="linkedin">LinkedIn URL</label>
  <input id="linkedin" name="linkedin" type="text" />

  <label for="location">Current Location</label>
  <input id="location" name="location" type="text" />

  <label for="workauth">Are you legally authorized to work in this location?</label>
  <input id="workauth" name="workauth" type="text" />

  <label for="cover">Why do you want to work here?</label>
  <textarea id="cover" name="cover"></textarea>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
