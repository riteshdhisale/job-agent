<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}job_agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('index') }}" class="brand">job_agent</a>
      <a href="{{ url_for('add_lead') }}">Add Lead</a>
      <a href="{{ url_for('add_browsed_page') }}">Add Browsed Page</a>
      <a href="{{ url_for('profile_view') }}">Profile</a>
      <form method="post" action="{{ url_for('set_engine') }}" class="engine-form">
        <label for="engine">Engine:</label>
        <select name="engine" id="engine" onchange="this.form.submit()">
          <option value="fake" {% if current_engine == 'fake' %}selected{% endif %}>fake (free)</option>
          <option value="claude" {% if current_engine == 'claude' %}selected{% endif %}>claude (paid)</option>
          <option value="gemini" {% if current_engine == 'gemini' %}selected{% endif %}>gemini (free tier)</option>
        </select>
      </form>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
